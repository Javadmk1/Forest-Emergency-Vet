name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project and import resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Forest-Emergency-Vet-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forest-Emergency-Vet-debug-apk
          path: build/Forest-Emergency-Vet-debug.apk
          if-no-files-found: error
          retention-days: 14
